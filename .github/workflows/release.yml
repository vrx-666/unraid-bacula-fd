name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version, e.g. 2026.10.11"
        required: true

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: out
      - name: Fill in the plugin file and publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}[a-z]?$ ]] || { echo "Version must look like 2026.10.11" >&2; exit 1; }
          PKG=$(ls out/*.txz)
          grep -q "\"$(basename "$PKG")\"" bacula-fd.plg || { echo "Package name in bacula-fd.plg does not match $PKG" >&2; exit 1; }
          sed -e "s/@VERSION@/$VERSION/" -e "s/@MD5@/$(md5sum "$PKG" | cut -d' ' -f1)/" bacula-fd.plg > out/bacula-fd.plg
          gh release create "$VERSION" out/bacula-fd.plg "$PKG" --title "$VERSION" --generate-notes
