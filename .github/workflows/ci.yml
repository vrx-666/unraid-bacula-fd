name: CI
run-name: CI ${{ inputs.unraid_version || github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      unraid_version:
        description: "Test only this Unraid version (empty = 7.0.0 + latest of each 7.x line)"
        required: false
        default: ""
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.v.outputs.list }}
    steps:
      - id: v
        env:
          ONE: ${{ inputs.unraid_version }}
        run: |
          if [ -n "$ONE" ]; then
            list=$(jq -cn --arg v "$ONE" '[$v]')
          else
            list=$(curl -fsSL https://releases.unraid.net/json | jq -c '
              [.[].version | select(startswith("7."))]
              | group_by(split(".")[0:2] | join("."))
              | map(max_by(split(".") | map(tonumber))) + ["7.0.0"] | unique')
          fi
          echo "Unraid versions: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --output type=local,dest=out .
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: out/*.txz

  test:
    needs: [versions, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unraid: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: out
      - env:
          UNRAID: ${{ matrix.unraid }}
        run: |
          [[ "$UNRAID" =~ ^[0-9]+(\.[0-9]+)*(-(beta|rc)\.[0-9]+)?$ ]] || { echo "Bad version: $UNRAID" >&2; exit 1; }
          ./test-unraid.sh "$UNRAID"
